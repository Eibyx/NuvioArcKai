name: NuvioArcKai ARMv7 release

# One armeabi-v7a APK, signed with the Kai keystore, verified, then published as a pre-release.
# Secrets: KAI_* names are read first, Arc's NUVIO_* names as a fallback, so existing secrets keep working.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: versionName, e.g. 1.1.0-nt.stable-kai.1 (must parse with VersionUtils)
        required: true
        type: string
      version_code:
        description: versionCode, higher than every earlier Kai release
        required: true
        type: string
      publish:
        description: Publish the verified APK as a GitHub pre-release
        required: true
        type: boolean
        default: false

concurrency:
  group: kai-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and release tooling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Python release tooling
        run: PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -v
      - name: Kotlin unit tests
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [[ -n "${LOCAL_PROPERTIES_BASE64}" ]]; then printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties; fi
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_[A-Z_]+)[[:space:]]*=/d' local.properties 2>/dev/null || true
          ./gradlew :app:testFullDebugUnitTest --continue
      - name: Brand logos render on light and dark
        run: |
          npm install --no-save playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node scripts/kai/render_brand_logos.js build/brand-render app/src/main/res/raw/terabox_logo.png app/src/main/res/raw/google_drive_logo.png app/src/main/res/raw/anilist_logo.png
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kai-unit-test-results
          path: |
            app/build/test-results/testFullDebugUnitTest/*.xml
            build/brand-render
          if-no-files-found: warn

  build:
    name: Build and verify armeabi-v7a APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
      KEYSTORE_BASE64: ${{ secrets.KAI_RELEASE_KEYSTORE_BASE64 || secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KAI_RELEASE_KEY_ALIAS || secrets.NUVIO_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KAI_RELEASE_KEY_PASSWORD || secrets.NUVIO_RELEASE_KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.KAI_RELEASE_STORE_PASSWORD || secrets.NUVIO_RELEASE_STORE_PASSWORD }}
      ANILIST_CLIENT_ID_SECRET: ${{ secrets.ANILIST_CLIENT_ID }}
    outputs:
      apk_sha256: ${{ steps.verify.outputs.apk_sha256 }}
      cert_sha256: ${{ steps.verify.outputs.cert_sha256 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore signing and public service configuration
        run: |
          missing=()
          for name in LOCAL_PROPERTIES_BASE64 KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("${name}")
          done
          if (( ${#missing[@]} )); then echo "Missing secrets: ${missing[*]}" >&2; exit 1; fi
          keystore="${RUNNER_TEMP}/kai-release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_[A-Z_]+)[[:space:]]*=/d' local.properties
          if [[ -n "${ANILIST_CLIENT_ID_SECRET}" ]]; then
            sed -i -E '/^[[:space:]]*ANILIST_CLIENT_ID[[:space:]]*=/d' local.properties
            printf '\nANILIST_CLIENT_ID=%s\n' "${ANILIST_CLIENT_ID_SECRET}" >> local.properties
          fi
          for property in TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET; do
            grep -Eq "^[[:space:]]*${property}[[:space:]]*=[[:space:]]*.+$" local.properties || { echo "Missing ${property} in local.properties" >&2; exit 1; }
          done
          if ! grep -Eq '^[[:space:]]*ANILIST_CLIENT_ID[[:space:]]*=[[:space:]]*[0-9]+[[:space:]]*$' local.properties; then
            echo "::warning::ANILIST_CLIENT_ID is missing or not numeric: the AniList QR sign-in will be hidden."
          fi
          {
            echo "NUVIO_RELEASE_STORE_FILE=${keystore}"
            echo "NUVIO_RELEASE_KEY_ALIAS=${KEY_ALIAS}"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${KEY_PASSWORD}"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${STORE_PASSWORD}"
          } >> "${GITHUB_ENV}"
      - name: Updater tests and release build
        run: |
          ./gradlew :app:testFullReleaseUnitTest --tests 'com.nuvio.tv.updater.*' \
            :app:assembleFullRelease -ParcVersionName='${{ inputs.version_name }}' -ParcVersionCode='${{ inputs.version_code }}' --stacktrace
      - name: Verify the APK
        id: verify
        run: |
          set -euo pipefail
          out=app/build/outputs/apk/full/release
          mapfile -t apks < <(find "${out}" -maxdepth 1 -name '*.apk' | sort)
          [[ "${#apks[@]}" == 1 && "${apks[0]}" == "${out}/app-full-armeabi-v7a-release.apk" ]] || { echo "Expected only the armeabi-v7a APK, found: ${apks[*]}" >&2; exit 1; }
          [[ -z "$(find app/build/outputs -name '*.aab')" ]] || { echo "App bundle produced" >&2; exit 1; }
          apk="${apks[0]}"
          bt="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          "${bt}/zipalign" -c -P 4 -v 4 "${apk}" > /dev/null
          "${bt}/apksigner" verify --verbose --print-certs "${apk}" | tee apksigner.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apksigner.txt
          cert="$(grep -m1 'Signer #1 certificate SHA-256 digest' apksigner.txt | awk '{print $NF}')"
          grep -qi 'CN=Android Debug' apksigner.txt && { echo "Signed with a debug certificate" >&2; exit 1; } || true
          "${bt}/aapt2" dump badging "${apk}" > badging.txt
          grep -q "package: name='com.eibyx.nuvioarckai' versionCode='${{ inputs.version_code }}' versionName='${{ inputs.version_name }}'" badging.txt
          grep -q "sdkVersion:'24'" badging.txt
          grep -q "targetSdkVersion:'36'" badging.txt
          [[ "$(grep '^native-code:' badging.txt)" == "native-code: 'armeabi-v7a'" ]]
          baseline=()
          [[ -f docs/kai/baseline-native.json ]] && baseline=(--baseline docs/kai/baseline-native.json)
          python3 scripts/verify_native_apk.py "${apk}" --kai "${baseline[@]}" --output native-inventory.json > /dev/null
          python3 scripts/kai/scan_apk_secrets.py "${apk}"
          cp "${apk}" app-full-armeabi-v7a-release.apk
          sha256sum app-full-armeabi-v7a-release.apk native-inventory.json > SHA256SUMS.txt
          echo "apk_sha256=$(sha256sum "${apk}" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          echo "cert_sha256=${cert}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v6
        with:
          name: kai-armv7-release
          path: |
            app-full-armeabi-v7a-release.apk
            native-inventory.json
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish pre-release
    needs: build
    if: inputs.publish && github.repository == 'Eibyx/NuvioArcKai'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: kai-armv7-release
      - name: Create the pre-release
        run: |
          tag='${{ inputs.version_name }}'
          cat > notes.md <<NOTES
          Nuvio Arc Kai ${tag} — compilación armeabi-v7a (Android 7+), se instala junto a Nuvio Arc.

          Novedades: TeraBox y Google Drive en Servidores multimedia, AniList en Seguimiento y botones de salto de opening/intro/ending también con ExoPlayer. Ver docs/kai/informe-final.md para lo verificado y lo NO VERIFICADO.

          - SHA-256 del APK: ${{ needs.build.outputs.apk_sha256 }}
          - SHA-256 del certificado de firma: ${{ needs.build.outputs.cert_sha256 }}

          Atribuciones: rclone-extra (MIT), Aniyomi/Mihon (Apache-2.0). Google Drive es una marca de Google LLC; TeraBox, de Flextech Inc.; AniList, de AniList.

          <!-- nuvio-fork-version-code: ${{ inputs.version_code }} -->
          NOTES
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "Nuvio Arc Kai ${tag}" --notes-file notes.md --prerelease \
            app-full-armeabi-v7a-release.apk SHA256SUMS.txt native-inventory.json
